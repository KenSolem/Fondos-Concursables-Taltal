<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fondos Concursables Taltal - En Construcción</title>
    <!-- Tailwind CSS para un diseño rápido y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Contenido Principal -->
    <main class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full text-center space-y-8 bg-slate-800/50 p-8 sm:p-10 rounded-2xl border border-slate-700/60 shadow-xl backdrop-blur-sm">
            
            <!-- Icono animado o distintivo -->
            <div class="flex justify-center">
                <div class="bg-amber-500/10 p-4 rounded-full border border-amber-500/20 text-amber-400 animate-pulse">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                    </svg>
                </div>
            </div>

            <!-- Títulos -->
            <div class="space-y-3">
                <span class="inline-block px-3 py-1 text-xs font-semibold tracking-wider text-amber-400 bg-amber-400/10 rounded-full uppercase border border-amber-400/20">
                    Pronto en línea
                </span>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">
                    Fondos Concursables Taltal
                </h1>
                <p class="text-sm sm:text-base text-slate-400 leading-relaxed">
                    Estamos preparando este espacio para facilitar la información y postulación a fondos concursables en nuestra comuna. 
                </p>
            </div>

            <!-- Barra de estado / Indicador -->
            <div class="pt-4 border-t border-slate-700/60">
                <div class="flex items-center justify-center space-x-2 text-xs text-slate-400">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span>
                    <span>Sitio en desarrollo activo</span>
                </div>
            </div>

        </div>
    </main>

    <!-- Pie de página -->
    <footer class="py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 Fondos Concursables Taltal. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
